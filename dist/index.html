<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>QGDS Web Components Sandpit Template</title>

  <!-- QGDS Web Components resources -->
  <link rel="stylesheet" href="assets/css/qgds-web-components.css">
  <script src="assets/js/qgds-web-components.js" defer></script>
</head>

<body>

  <!-- Callout -->
  <qgds-callout>
    <p>This is a callout component.</p>
  </qgds-callout>

  <!-- In-page alert -->
  <qgds-inpage-alert>
    <h3 slot="headline">In-page Alert</h3>
    <p>This is an in-page alert component.</p>
  </qgds-inpage-alert>

  <!-- Buttons -->
  <qgds-button>Click Me</qgds-button>
  <qgds-button palette="dark" size="large" variant="dark">Dark</qgds-button>
  <qgds-button variant="dark-alt">Dark Alt</qgds-button>

</body>

</html>
