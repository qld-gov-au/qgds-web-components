# This workflow will publish a package to GitHub Packages when release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish NPM Package

on:
  #push:
  #On versioned releases
  #tags:
  #  - v*.*.*
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      publish:
        type: choice
        description: Publish to NPM
        options:
          - No (Dry run only)
          - Yes
        default: No (Dry run only)
      release_tag:
        type: choice
        description: NPM dist-tag to publish under
        options:
          - alpha
        default: alpha

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ["22"]
    name: Lint, Build and Deploy on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install #run on lint step (Which is cached)
        run: | # Install packages per package-lock.json only
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Build 🔧
        run: | # build the files
          npm run build

  publish-npm:
    needs: build
    env:
      HAVE_DEPLOY_KEY: ${{ github.repository == 'qld-gov-au/qgds-web-components' }}
      # Publish only from the upstream repo and when explicitly chosen; otherwise a dry run is performed
      DO_DEPLOYMENT: ${{ github.repository == 'qld-gov-au/qgds-web-components' && inputs.publish == 'Yes' && inputs.release_tag == 'alpha' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC
    environment:
      name: npmjs
      url: https://www.npmjs.com/package/@qld-gov-au/qgds-web-components
    steps:
      - uses: actions/checkout@v6

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: "npm"
          scope: "@qld-gov-au"

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: |
          echo "installing via incremental upgrade to use latest npm in node 22 (not required in node 24+)"
          npm install -g npm@~11.10.0
          npm install -g npm@latest

      - run: npm ci

      - name: Build 🔧
        run: | # build the files
          npm run build

      - name: Publish
        if: ${{ env.DO_DEPLOYMENT == 'true' }}
        run: |
          npm publish --tag ${{ inputs.release_tag }} --provenance --access=public

      - name: Publish - Dry Run
        if: ${{ env.DO_DEPLOYMENT != 'true' }}
        run: |
          npm publish --tag ${{ inputs.release_tag }} --access=public --dry-run

      - name: Summary
        run: |
          if [ "$DO_DEPLOYMENT" = "true" ]; then
            echo "### Published to npm with tag ${{ inputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          elif [ "$HAVE_DEPLOY_KEY" != "true" ]; then
            echo "### Dry run only: this is a fork" >> $GITHUB_STEP_SUMMARY
            echo "To publish to npmjs.org, change the package scope and update this file to the new repo location." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Dry run only: Publish was not set to Yes" >> $GITHUB_STEP_SUMMARY
          fi
