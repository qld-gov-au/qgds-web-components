name: Publish NPM Package

on:
  workflow_dispatch:
    inputs:
      force:
        type: choice
        description: Confirm publish
        options:
          - No
          - Yes
        default: "No"
      release_tag:
        type: choice
        description: NPM dist-tag to publish under
        options:
          - alpha
          - latest
        default: alpha

jobs:
  build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm" # Simplifies your manual cache block

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build 🔧
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 1

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Only run on the main repo and if 'Yes' was selected
    if: github.repository == 'qld-gov-au/qgds-web-components' && github.event.inputs.force == 'Yes'
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC/Provenance
    environment:
      name: npmjs
      url: https://www.npmjs.com/package/@qld-gov-au/qgds-web-components
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          scope: "@qld-gov-au"

      - name: Preflight version check
        id: preflight
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists on npm. Please bump version."
            exit 1
          fi
          echo "Ready to publish $PACKAGE@$VERSION"

      - name: Publish
        run: npm publish --tag ${{ github.event.inputs.release_tag }} --provenance --access=public
        env:
          # Ensure this secret is set in your GitHub Repo/Environment settings
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Helpful summary if the publish job was skipped due to 'force' being 'No'
  report-skipped:
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.force == 'No'
    steps:
      - run: |
          echo "### Publish skipped" >> $GITHUB_STEP_SUMMARY
          echo "Reason: 'Confirm publish' was set to 'No'." >> $GITHUB_STEP_SUMMARY
