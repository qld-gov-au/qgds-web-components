# Deploy Storybook to GitHub Pages
# POST-PR DEPLOYMENT WORKFLOW
# Runs after CI workflow completes successfully on main or develop

name: Deploy

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

on:
  # TEMPORARY: Execute on each push for testing
  push:
    branches:
      - main
      - develop
      - '**'  # All branches for testing
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers after CI workflow completes on main or develop
  # TODO: Remove push trigger above after testing, keep only workflow_run
  workflow_run:
    workflows: [CI] # References the CI workflow name
    branches: [main, develop]
    types: [completed]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        node: ["22"]
    # Only deploy if the workflow_run was successful (or manual trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: List the state of node modules
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: npm list

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Rebuild and prepare
        run: npm rebuild && npm run prepare --if-present

      - name: Install Rollup binary
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build project
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storybook
          path: storybook-static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 🚀 Storybook Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.workflow_run.head_branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployed Storybook reflects the latest accepted changes from the merged PR." >> $GITHUB_STEP_SUMMARY
